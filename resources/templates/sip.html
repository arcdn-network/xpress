<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter';
      background: #ffffff;
      display: flex;
      justify-content: center;
    }

    .voucher {
      position: relative;
      width: 100%;
    }

    .watermark {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .12;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    /* check */
    .content-check {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 5rem;
      margin-top: 4rem;
    }

    .check-circle {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: #1DCF79;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .titulo {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: #4B4D50;
      margin-top: 0.5rem;
    }

    .slash {
      font-size: 1.2em;
      display: inline-block;
      transform: translateY(.03em);
      margin: 0 -.03em;
    }

    .monto {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      color: #1B1B1D;
      margin-bottom: 1.5rem;
    }

    /* card */
    .card {
      background: #F7F7F7;
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin: 1.5rem 1rem;
    }

    .card .label {
      font-size: .875rem;
      color: #9F9FA1;
      margin-bottom: .25rem;
    }

    .card .value {
      font-size: 0.85rem;
      color: #1B1B1B;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .card .value:last-child {
      margin-bottom: 0;
    }

    .badge {
      display: inline-block;
      background: #1DCF79;
      color: #ffffff;
      font-size: .75rem;
      border-radius: 1rem;
      padding: .2rem 0.6rem;
    }

    /* buttons */
    .container-button {
      padding: 0 1rem;
      margin: 10rem 0;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 0.5rem;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-bottom: 1rem;
    }

    .btn-share {
      background: #EBF8FE;
      color: #00AFFE;
    }

    .btn-home {
      background: #00AFFE;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="voucher">

    <!-- <img src="sip.jpg" alt="" class="watermark"> -->

    <div class="content-check">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 13 9 18 20 6"></polyline>
        </svg>
      </div>
    </div>

    <div class="titulo">¡Sipeaste!</div>
    <div class="monto">
      S<span class="slash">/</span> {{MONTO}}
    </div>

    <div class="card">
      <div class="label">Enviado a</div>
      <div class="value">{{NOMBRE}}<br>{{CELULAR}}</div>

      <div class="label">Destino</div>
      <div class="value">{{DESTINO}}</div>

      <div class="label">Fecha y hora</div>
      <div class="value">{{FECHA_HORA}}</div>

      <div class="label">Comisión</div>
      <div class="value"><span class="badge">GRATIS</span></div>

      <div class="label">Número de operación</div>
      <div class="value">{{OPERACION}}</div>
    </div>

    <div class="container-button">
      <button class="btn btn-share">
        Compartir constancia
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <button class="btn btn-home">Ir a inicio</button>
    </div>

  </div>

</body>

</html>
