<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

   <style>
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
      }

      @font-face {
         font-family: "Quicksand";
         src: url('{{FONT_BASE64}}') format('woff2');
         font-weight: 400 700;
      }

      html,
      body {
         font-family: "Quicksand", sans-serif;
         color: #726F84;
         width: 100%;
         position: relative;
         margin: 0;
      }

      body {
         background: #fff;
      }

      body::after {
         content: "";
         position: fixed;
         inset: 0;
         background: url('{{BACKGROUND}}') top center / cover no-repeat;
         z-index: -1;
         pointer-events: none;
      }

      .container {
         margin-left: 2rem;
         margin-right: 2rem;
         padding-left: 0.25rem;
         padding-right: 0.25rem;
      }

      .row {
         padding-top: 0.5rem;
         padding-bottom: 0.5rem;
         line-height: 1.3;
         justify-content: space-between;
         display: flex;
      }

      .border {
         border-bottom: 1.5px solid #EDEDED;
      }

      .label {
         color: #8018B7;
         font-weight: 700;
         font-size: 1rem;
         display: flex;
         align-items: center;
      }

      .value {
         font-weight: 500;
         text-align: right;
         font-size: 1rem;
         max-width: 230px;
         word-break: break-word;
      }

      .box {
         margin-top: 14.25rem;
         margin-bottom: 2rem;
         text-align: center;
      }

      .titulo {
         color: #5A566F;
         font-size: 1.2rem;
         font-weight: 700;
      }

      .monto {
         font-weight: 600;
         font-size: 2rem;
         margin-bottom: 0.35rem;
         color: #000000;
      }

      .fecha {
         font-size: 1rem;
      }
   </style>
</head>

<body>

   <div>
      <div class="box">

         <div class="titulo">
            Operación Exitosa
         </div>

         <div class="monto">
            S/ {{MONTO}}
         </div>

         <div class="fecha">
            {{FECHA}} - {{HORA}}
         </div>

      </div>
   </div>

   <div class="container">

      <div class="row border">
         <span class="label">
            Operación
         </span>

         <span class="value">
            Enviar a número de celular
         </span>
      </div>

      <div class="row border">
         <span class="label">
            Destinatario
         </span>

         <span class="value">
            {{DESTINATARIO}}
         </span>
      </div>

      <div class="row border">
         <span class="label">
            Entidad
         </span>

         <span class="value">
            {{ENTIDAD}}
         </span>
      </div>

      <div class="row border">
         <span class="label">
            Comisión
         </span>

         <span class="value">
            S/ 0.00
         </span>
      </div>

      <div class="row border">
         <span class="label">
            CCI
         </span>

         <span class="value">
            {{CCI}}
         </span>
      </div>

      {{MENSAJES_ROW}}

      <div class="row">
         <span class="label">
            Código
         </span>

         <span class="value">
            {{CODIGO}}
         </span>
      </div>

   </div>

</body>

</html>
