<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Plin · Demostración</title>
  <style>
    @font-face {
      font-family: 'Plin Poppins';
      src: url('{{FONT_REGULAR}}') format('truetype');
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Plin Poppins';
      src: url('{{FONT_MEDIUM}}') format('truetype');
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: 'Plin Poppins';
      src: url('{{FONT_SEMIBOLD}}') format('truetype');
      font-weight: 600;
      font-display: swap;
    }

    .plin-template {
      display: block;

      .voucher-surface {
        position: relative;
        isolation: isolate;
        container-type: size;
        overflow: hidden;
      }

      .voucher-body {
        height: 100%;
        overflow: auto;
        background: #05be50;
        color: #1a1a1a;
        font-family: 'Plin Poppins', sans-serif;
      }

      .header-green {
        flex: 0 0 clamp(8rem, 24cqh, 14rem);
        padding-top: 2rem;
      }

      .plin-logo {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }

      .card-white {
        flex: 1 0 auto;
        background: #fff;
        border-radius: 2rem 2rem 0 0;
      }

      .voucher-content {
        flex: 1;
      }

      .text-plin-green {
        color: #05be50;
      }

      .success-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .amount-container {
        font-size: 2.4rem;

        .amount-currency {
          font-size: 1.25rem;
        }

        .number-amount {
          line-height: 1;
        }
      }

      .recipient-name {
        margin: 0;
        font-weight: 500;
        color: #494e56;
      }

      .date-text {
        margin: 0;
        font-size: .75rem;
        color: #70747a;
      }

      .detail-row {
        gap: .75rem;
        font-size: .875rem;
      }

      .detail-label {
        color: #969ba5;
      }

      .detail-value {
        color: #181a1d;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .operation-value {
        display: inline-flex;
        align-items: center;
        gap: .375rem;
      }

      .copy-operation {
        display: inline-flex;
        align-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .separator-light {
        height: 1px;
        background: #f1f2f4;
      }

      .message-section {
        overflow-wrap: anywhere;
        font-size: .875rem;
      }

      .buttons-container {
        flex-shrink: 0;
      }

      .plin-btn-primary,
      .plin-btn-outline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        height: 3rem;
        border-radius: 999px;
        font: 500 .875rem "Plin Poppins", sans-serif;
      }

      .plin-btn-primary {
        background: #0037a5;
        color: #fff;
        border: 0;
      }

      .plin-btn-outline {
        background: #fff;
        color: #0037a5;
        border: 1.5px solid #0037a5;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .voucher-surface {
      height: 100vh;
    }

    .flex {
      display: flex;
    }

    .flex-column {
      flex-direction: column;
    }

    .justify-content-center {
      justify-content: center;
    }

    .justify-content-between {
      justify-content: space-between;
    }

    .align-items-center {
      align-items: center;
    }

    .gap-2 {
      gap: .5rem;
    }

    .px-4 {
      padding-inline: 1.5rem;
    }

    .pt-4 {
      padding-top: 1.5rem;
    }

    .pb-3 {
      padding-bottom: 1rem;
    }

    .py-3 {
      padding-block: .75rem;
    }

    .py-5 {
      padding-block: 1.5rem;
    }

    .mt-3 {
      margin-top: 1rem;
    }

    .mt-1 {
      margin-top: .25rem !important;
    }

    .mb-3 {
      margin-bottom: 1rem;
    }

    .mb-2 {
      margin-bottom: .5rem;
    }

    .m-0 {
      margin: 0;
    }

    .block {
      display: block;
    }
  </style>
</head>

<body class="plin-template">
  <div class="voucher-surface">
    <div class="voucher-body flex flex-column">
      <div class="header-green flex justify-content-center align-items-center">
        <img src="{{PLIN_LOGO}}" alt="Plin" class="plin-logo">
      </div>

      <div class="card-white flex flex-column">
        <div class="voucher-content px-4 pt-4 pb-3">
          <h2 class="text-plin-green success-title">Plineo exitoso</h2>
          <div class="amount-container flex gap-2 text-plin-green mt-3">
            <span class="amount-currency">S/</span>
            <span class="number-amount">{{MONTO}}</span>
          </div>
          <div class="recipient-info mt-3">
            <p class="recipient-name">a <span>{{NOMBRE}}</span></p>
            <p class="date-text mt-1">{{FECHA}}</p>
          </div>
          <div class="details-section mt-3">
            <div class="detail-row flex justify-content-between align-items-center py-3">
              <span class="detail-label">Enviado a</span>
              <span class="detail-value">
                <span>{{CELULAR}}</span><span>{{DESTINO}}</span>
              </span>
            </div>
            <div class="separator-light"></div>
            <div class="detail-row flex justify-content-between align-items-center py-3">
              <span class="detail-label">Cuenta de cargo</span>
              <span class="detail-value">Cuenta Ahorros</span>
            </div>
            <div class="separator-light"></div>
            <div class="detail-row flex justify-content-between align-items-center py-3">
              <span class="detail-label">Código de operación</span>
              <span class="detail-value operation-value">
                {{OPERACION}}
                <button type="button" class="copy-operation" aria-label="Copiar código de operación">
                  <img src="{{COPY_ICON}}" alt="" width="24" height="24">
                </button>
              </span>
            </div>
            <div class="message-section mt-3" {{MESSAGE_HIDDEN}}>
              <span class="detail-label block mb-2">Mensaje</span>
              <p class="m-0">“{{MENSAJE}}”</p>
            </div>
          </div>
        </div>

        <div class="buttons-container px-4 py-5 mb-2">
          <button type="button" class="plin-btn-primary font-medium mb-3">
            Compartir <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              aria-hidden="true">
              <path d="m9 11 6-4m-6 6 6 4" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="5" r="3" />
              <circle cx="18" cy="19" r="3" />
            </svg>
          </button>
          <button type="button" class="plin-btn-outline font-medium">Volver a Plin</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
